<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Вырасти Сад 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial; }
        #ui { position: fixed; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px black; font-size: 18px; z-index: 10; }
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; }
        #menu h1 { font-size: 48px; margin: 10px; text-shadow: 3px 3px 6px black; }
        .char-btn { padding: 15px 30px; margin: 8px; border: none; border-radius: 12px; font-size: 22px; cursor: pointer; width: 250px; }
        .fox { background: #FF8C42; }
        .tiger { background: #FFD700; }
        .seal { background: #9FC5E8; }
        .penguin { background: #1a1a2e; color: #FFD700; border: 3px solid #FFD700; }
    </style>
</head>
<body>
    <div id="ui">
        <div>💰 <span id="money">50</span></div>
        <div>🌱 <span id="seeds">5</span></div>
    </div>
    <div id="menu">
        <h1>🌿 ВЫРАСТИ САД 🌿</h1>
        <p>Выбери персонажа:</p>
        <button class="char-btn fox" onclick="startGame('fox')">🦊 Лиса</button>
        <button class="char-btn tiger" onclick="startGame('tiger')">🐯 Тигр</button>
        <button class="char-btn seal" onclick="startGame('seal')">🦭 Тюлень</button>
        <button class="char-btn penguin" onclick="startGame('penguin')">🐧 Пингвин ★</button>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
